name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/sooqna-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/sooqna-backend/package-lock.json

      - name: Install dependencies
        timeout-minutes: 8
        env:
          npm_config_fetch_retries: "2"
          npm_config_fetch_timeout: "60000"
        run: npm ci --no-audit --no-fund --prefer-offline --foreground-scripts --loglevel=info

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Audit production dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        env:
          # Keep tests in JSON fallback mode. Leaving DATABASE_URL unset is
          # intentional: if a test boots the notification scheduler, it must not
          # construct the Prisma-backed operations repository and try localhost.
          NODE_ENV: test
          ENABLE_CATEGORIES_JSON_FALLBACK: "true"
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

  web:
    name: Web Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        timeout-minutes: 8
        env:
          npm_config_fetch_retries: "2"
          npm_config_fetch_timeout: "60000"
        run: npm ci --no-audit --no-fund --prefer-offline --foreground-scripts --loglevel=info

      - name: Audit production dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Validate WordPress redirect mapping
        run: npm run validate:redirects

      - name: Lint
        run: npm run lint

      - name: Test production resource origins
        run: |
          node ./node_modules/typescript/bin/tsc --module commonjs --target es2020 --esModuleInterop --skipLibCheck --outDir "$RUNNER_TEMP/web-regression-tests" tests/browserApiBase.test.ts tests/mediaUrl.test.ts
          node "$RUNNER_TEMP/web-regression-tests/tests/browserApiBase.test.js"
          node "$RUNNER_TEMP/web-regression-tests/tests/mediaUrl.test.js"

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: https://ci.flashpointjordan.local
          NEXT_PUBLIC_BACKEND_API_BASE_URL: https://ci.flashpointjordan.local/api
          NEXT_PUBLIC_UPLOADS_PUBLIC_BASE_URL: https://ci.flashpointjordan.local/uploads
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder-auth-domain
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder-project-id
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ci-placeholder-sender-id
          NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder-app-id
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ci-placeholder-measurement-id
        run: npm run build
