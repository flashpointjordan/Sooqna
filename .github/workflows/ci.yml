name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/sooqna-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/sooqna-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Audit production dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        env:
          # Tests mock Prisma (or are pure) and never hit a live DB, but env.ts
          # loads at import time and requires DATABASE_URL unless fallback mode is
          # on. Provide DB-less test env so config validation passes in CI.
          NODE_ENV: test
          ENABLE_CATEGORIES_JSON_FALLBACK: "true"
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test?schema=public
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

  web:
    name: Web Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Validate WordPress redirect mapping
        run: npm run validate:redirects

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: https://ci.flashpointjordan.local
          NEXT_PUBLIC_BACKEND_API_BASE_URL: https://ci.flashpointjordan.local/api
          NEXT_PUBLIC_UPLOADS_PUBLIC_BASE_URL: https://ci.flashpointjordan.local/uploads
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder-auth-domain
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder-project-id
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ci-placeholder-sender-id
          NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder-app-id
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ci-placeholder-measurement-id
        run: npm run build
